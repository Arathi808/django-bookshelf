{% extends 'books/base.html' %}
{% load static %}
{% block content %}
<link rel="stylesheet" href="{% static 'books/delete_book.css' %}">
<section class="delete-box">
    <h1>Delete Book</h1>
    <p>Are you sure you want to delete this book?</p>
    <h3>{{ book.title }}</h3>
    <form method="POST">
        {% csrf_token %}
        <button type="submit">Yes, Delete</button>
        <a href="/books/">Cancel</a>
    </form>
</section>
{% endblock %}
